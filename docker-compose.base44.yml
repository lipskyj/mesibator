services:
  web:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:ro
      - ./nginx.base44.conf:/etc/nginx/nginx.conf:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
