user root;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 3000;
        server_name _;
        root /app;
        index "mesibathaor3 (1).html";
        charset utf-8;

        location / {
            try_files $uri $uri/ "/mesibathaor3 (1).html";
        }
    }
}
